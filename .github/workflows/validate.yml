name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: qrapido-ci
      GCLOUD_PROJECT: qrapido-ci
      NEXT_PUBLIC_FIREBASE_API_KEY: emulator-only
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: qrapido-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: qrapido-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: qrapido-ci.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:emulator
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm declared by the project
        run: |
          npm install --global npm@10.8.2
          test "$(npm --version)" = "10.8.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:emulator
      - run: npm run test:e2e
