name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: qrapido-ci
      GCLOUD_PROJECT: qrapido-ci
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: qrapido-ci
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:secrets
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:emulator
      - run: npm run test:e2e
